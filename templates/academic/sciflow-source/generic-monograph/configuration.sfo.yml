# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/page-offset/page-offset.schema.json
kind: PageOffset
metadata:
  name: for-front
page: front
runners:
  - princexml
spec:
  offset: 1
  offsetKey: book-meta.fpage
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/environment/environment.schema.json
# Set up the environment for the PDF and HTML output
kind: Environment
ui:
  showTo:
    - editor
spec:
  environments:
    image:
      labelSuffix: ":"
      align:
        content: center
        caption: justify
      floats:
        placement: top
        deferPage: none
        modifier: unless-fit
    table:
      labelSuffix: ":"
      theme: table2
      lineHeight: 1.2
      fontSize: 11pt
      align:
        content: center
        caption: justify
      captionSide: above
      floats:
        # optimize for white space
        placement: snap
        modifier: unless-fit # do not snap if it fits into the normal page flow
    equation:
      margin: 1rem 0 1rem 5mm
      align:
        content: start
  allowCustomLabels: true
  typography:
    label:
      fontWeight: normal
      marginRight: 0.125rem
    caption:
      marginY: 0.5rem
      fontSize: 9pt
  renderCaptionsInline: true
translations:
  de-DE:
    environments:
      image:
        label: Bild
        referenceLabel: Bild
      table:
        label: Tabelle
        referenceLabel: Tabelle
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/footnote/footnote.schema.json
# Set up the footnotes for the HTML output
kind: Footnote
ui:
  showTo: []
runners:
  - html
spec: 
  mode: endnote
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/footnote/footnote.schema.json
# Set up the footnotes for the PDF output
kind: Footnote
ui:
  showTo:
    - editor
runners:
  - princexml
spec: 
  footnote:
    margin: "0"
  policy: keep-with-line
  fontSize: 9pt
  textAlign: justify
  lineHeight: 1.2
  breakInside: auto
  marker:
    align: super
    suffix: " "
    fontSize: 7pt
    spaceAfter: 0rem
  separatorStyle: clipped-line
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/variant/variant.schema.json
kind: Variant
ui:
  showTo: []
metadata:
    title: A5
    description: |-
      Sets the export up for A5
    group: page-sizes
spec:
  patches:
    - type: default
      patch:
        - op: replace
          path: /properties/page/properties/size/default
          value: A5
        - op: replace
          path: /properties/page/properties/font/properties/size/default
          value: 10pt
        - op: replace
          path: /properties/page/properties/margins/properties/inner/default
          value: 23mm
        - op: replace
          path: /properties/page/properties/margins/properties/outer/default
          value: 18mm
      target:
        kind: Page
    - type: default
      target:
        kind: Typography
      patch:
        - op: replace
          path: /properties/blockquote/properties/fontSize/default
          value: 9pt
        - op: replace
          path: /properties/h5/properties/fontSize/default
          value: 10pt
    - type: default
      target:
        kind: HeadersAndFooters
        metadata:
          name: for-front
      patch: 
      - op: replace
        path: /properties/typography/properties/header/properties/height/default
        value: 23mm
    - type: default
      target:
        kind: HeadersAndFooters
        metadata:
          name: for-body
      patch:
      - op: replace
        path: /properties/typography/properties/header/properties/height/default
        value: 23mm
    - type: default
      target:
        kind: HeadersAndFooters
        metadata:
          name: for-back
      patch:
      - op: replace
        path: /properties/typography/properties/header/properties/height/default
        value: 23mm
    - type: default
      target:
        kind: Environment
      patch:
      - op: replace
        path: /properties/environments/properties/table/properties/fontSize/default
        value: 10pt
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/settings/settings.schema.json
# Define the settings exposed in the UI
kind: Settings
ui:
  showTo: []
spec:
  quickSettings:
    components:
      - component:
          name: Environment
          options:
            - path: environments.image.label
              description: Label (e.g. Bild, Figure, Abbildung)
            - path: environments.image.referenceLabel
              description: Label to be used in cross references (e.g. see fig. 1, see abb. 1, )
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/epub-page/epub-page.schema.json
kind: EpubPage
ui:
  showTo:
    - editor
runners:
  - epub
spec:
  toc:
    depth: 5
  page:
    font:
      family: Noto Sans, Noto SansMath, Noto Color Emoji, sans-serif
      size: 11pt
      lineHeight: 1.4
  transformImages:
    format: JPEG
    quality: 80
    dpi: 72
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/reader/reader.schema.json
kind: Reader
ui:
  showTo:
    - editor
spec:
  display:
    showToc: false
    showDca: false
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/book-meta/book-meta.schema.json
kind: BookMeta
ui:
  showTo:
    - editor
spec: {}
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/static/static.schema.json
kind: Static
ui:
  showTo: []
runners:
  - reader
metadata:
  name: reader-copyright-dca
  reader:
    position: dca
spec:
  dom: >
    <section class='col-12' role='region' aria-roledescription='Copyright and permissions'>
      <h1 class='h2 m0' id='copyright-title'>Copyright and permissions</h1>
      <p class="mt0">
        Copyright ©
        <span>
          {{#if (getMetaData 'PermissionsMeta.copyrightYear')}}
            <span aria-label='Copyright Year'>
              {{getMetaData 'PermissionsMeta.copyrightYear'}}
            </span>
          {{/if}}
          {{#if (getMetaData 'PermissionsMeta.copyrightHolder')}}
            <span aria-label='Copyright Holder'>
              {{getMetaData 'PermissionsMeta.copyrightHolder'}}.
            </span>
          {{/if}}
          {{#if (getMetaData 'PermissionsMeta.copyrightStatement')}}
            <span aria-label='Copyright Statement'>
              {{getMetaData 'PermissionsMeta.copyrightStatement'}}
            </span>
          {{/if}}
        </span>
      </p>

      <p>
        {{#if (getMetaData 'PermissionsMeta.licenseP')}}
          <span aria-label='License information'>
            {{getMetaData 'PermissionsMeta.licenseP'}}
          </span>
        {{/if}}

        {{#if (getMetaData 'PermissionsMeta.licenseType')}}
          License type:
          <strong aria-label='License Type'>{{getMetaData 'PermissionsMeta.licenseType'}}</strong>
        {{/if}}
      </p>

      {{#if (getMetaData 'PermissionsMeta.licenseLink')}}
        <p>
          <a
            href='{{getMetaData "PermissionsMeta.licenseLink"}}'
            target='_blank'
            rel='noopener'
            aria-label='View full license'
          >
            View License
          </a>
        </p>
      {{/if}}
    </section>
