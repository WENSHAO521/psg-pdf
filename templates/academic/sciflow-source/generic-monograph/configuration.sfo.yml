# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/configuration/configuration.schema.json
kind: Configuration
ui:
  showTo: []
spec:
  slug: generic-monograph
  title: "Monograph template"
  publisher: Unicorn University
  type: thesis
  hidden: false
  description: "Template for Monographs"
  language: de-DE
  languageAlternatives:
    - en-US

  citationStyle:
    id: apa
  citationStyleAlternative: []

  labels:
    - html
    - epub
    - princexml
    - reader
    - bitsxml

  assets:
    # - id: coverpage
    #   type: hbs
    #   path: ./assets/coverpage.hbs
    #   inline: true
    - id: logo
      type: logo
      path: tpl/generic-monograph/assets/logo.jpeg
      dimensions:
        width: 372px
        height: 200px
    - id: headers-and-footers
      type: hbs
      path: ./assets/headers-and-footers.hbs
      inline: true
    - id: headers-and-footers-html
      type: hbs
      path: ./assets/headers-and-footers-html.hbs
      inline: true
    - id: front-headers-and-footers
      type: hbs
      path: ./assets/front-headers-and-footers.hbs
      inline: true
  variantGroups:
    - name: page-sizes
      title: Page Sizes
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/page/page.schema.json
# Set up the page for the PDF output only
kind: Page
ui:
  showTo:
     - editor
runners:
  - princexml
spec:
  placements:
    - cover
    - front
    - body
    - back
  page:
    pdfLayout: two-page-right
    bodyPadding: 0mm
    pageBreaks:
      beforeChapter: recto
    font:
      family: Noto Sans, Noto SansMath, Noto Color Emoji, sans-serif
      size: 11pt
    size: 17cm 24cm
    margins:
      inner: 25mm
      outer: 20mm
      top: 17mm
      bottom: 20mm
    handling: double-sided
  typesetting:
    widows: 2
    orphans: 3
    indent: 0mm
    lineHeight: 1.2
    paragraphSpacing: 6pt
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/typography/typography.schema.json
kind: Typography
ui:
  showTo:
    - editor
spec:
  front:
    margin: 1rem
    h1:
      fontSize: 1.2rem
  h1:
    fontSize: 1.5rem
    numbering:
      suffix: "."
  h2:
    fontSize: 1.25rem
  h3:
    fontSize: 1rem
  h4:
    fontSize: 1rem
  h5:
    fontSize: 1rem
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/google-font/google-font.schema.json
kind: GoogleFont
ui:
  showTo:
    - editor
spec:
  api:
    url: >-
      https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+Arabic:wght@300;400;700&family=Noto+Sans+Math&family=Noto+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Noto+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/html-page/html-page.schema.json
# Set up the HTML page for the HTML output
kind: HtmlPage
ui:
  showTo:
    - editor
runners:
  - html
spec:
  page:
    hyphens: manual
    font:
      family: Noto Sans, Noto SansMath, Noto Color Emoji, sans-serif
      size: 10pt
      lineHeight: 14pt
  indent: 0mm
  paragraphSpacing: 2mm
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/headers-and-footers/headers-and-footers.schema.json
# Set up the headers and footers for the HTML output (positioned in the beginning of configurations to appear first)
kind: HeadersAndFooters
ui:
  showTo: []
runners:
  - html
page: cover
spec:
  template:
    fileId: headers-and-footers-html
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/monograph-title/monograph-title.schema.json
kind: MonographTitle
ui:
  showTo: []
page: cover
runners:
  - princexml
spec:
  typography:
    paragraph:
      fontSize: 12pt
      fontFamily: Noto Serif, serif
      fontWeight: lighter
    h1:
      fontSize: 24pt
      fontWeight: bold
      fontFamily: Noto Serif, serif
    h2:
      fontSize: 16pt
      fontWeight: normal
      fontFamily: Noto Serif, serif
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/headers-and-footers/headers-and-footers.schema.json
# Set up the headers and footers for the PDF output
kind: HeadersAndFooters
ui:
  showTo: []
metadata:
  name: for-front
runners:
  - princexml
page: front
spec:
  pageCounter:
    style: lower-roman
    reset: after
  typography:
    firstPage:
      header:
        height: 25mm
    header:
      fontSize: 9pt
      height: 25mm
    footer:
      fontSize: 9pt
      height: 20mm
  template:
    fileId: headers-and-footers
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/headers-and-footers/headers-and-footers.schema.json
# Set up the headers and footers for the PDF output
kind: HeadersAndFooters
ui:
  showTo: []
metadata:
  name: for-body
runners:
  - princexml
page: body
spec:
  pageCounter:
    style: decimal
    reset: before
  formatting:
    authorNames:
      preset: authorsEtAlLastNameCaps
  typography:
    firstPage:
      header:
        height: 25mm
    header:
      fontSize: 9pt
      height: 25mm
    footer:
      fontSize: 9pt
      height: 20mm
  template:
    fileId: headers-and-footers
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/headers-and-footers/headers-and-footers.schema.json
# Set up the headers and footers for the PDF output
kind: HeadersAndFooters
ui:
  showTo: []
metadata:
  name: for-back
runners:
  - princexml
page: back
spec:
  pageCounter:
    style: decimal
  typography:
    firstPage:
      header:
        height: 25mm
    header:
      fontSize: 9pt
      height: 25mm
    footer:
      fontSize: 9pt
      height: 20mm
  template:
    fileId: headers-and-footers
---
kind: ContentHole
# the content hole moves all chapters created in the document to this position (so the toc is after them)
ui:
  showTo: []
metadata:
  name: content-hole-for-front
page: front
spec: {}
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/table-of-contents/table-of-contents.schema.json
kind: TableOfContents
spec:
  depth: 5
  breaks:
    keepLastLeafItemsTogether: 1
translations:
  de-DE:
    label: Inhaltsverzeichnis
  en-US:
    label: Table of Contents
---
# yaml-language-server: $schema=https://cdn.sciflow.net/schema/2026.1/export/components/listings/listings.schema.json
kind: Listings
runners:
  - princexml
  - html
  - epub
spec:
  individualPage: each-listing-recto
  environments:
    image:
      threshold: 2
      toc: true
    table:
      threshold: 2
      toc: true
translations:
  de-DE:
    title: Verzeichnisse
    environments:
      image:
        listingLabel: Abbildungsverzeichnis
      table:
        listingLabel: Tabellenverzeichnis
---
