name: Suggest an improvement
description: An idea for PSG PDF or PSG Academic PDF.
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - PSG PDF
        - PSG Academic PDF
        - Both
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: The task you are trying to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Screenshots or sketches of PSG's own interface are welcome.
