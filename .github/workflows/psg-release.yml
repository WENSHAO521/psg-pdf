name: PSG release

# The one workflow that builds, checks and publishes the installers of the two independent PSG
# products, PSG PDF and PSG Academic PDF (packaging/products.toml, docs/products.md). Every
# installer comes from this file (docs/releasing.md):
#   - `products` checks every packaging file against packaging/products.toml and gives the build
#     its product x platform matrix, so each product is built, checked and uploaded on its own;
#   - `install-*` install both products' packages on each platform, alone and side by side,
#     uninstall them one at a time, and (Windows, Linux) migrate a 0.18.x PSG PDF Suite install;
#   - a pull request builds every installer and runs the checks; nothing is published, and the
#     installers stay on the run as artifacts for a week;
#   - every push to `beta` also publishes a pre-release vX.Y.Z-beta.<run> with the changes since
#     the last release as its notes;
#   - a push to `main` whose CHANGELOG.md has a section for the Cargo.toml version, and which has
#     no tag yet, publishes the stable release vX.Y.Z with that section as its notes.
# packaging/release-tag.sh decides which (or neither). Nothing is published unless the changelog,
# academic and Linux and Windows install checks pass. Both products go into the same GitHub release;
# each product's in-app updater only picks files named after it (`<asset_stem>-<version>-…`), so
# each keeps its own update channel. Signing secrets are optional and only used on pushes: without them
# the macOS DMG is ad-hoc signed and the Windows files unsigned, and the job summary warns.
# The quality gates that are not about installers (ci.yml, fuzz, FreeBSD, Nix, SonarCloud, house
# rules, packaging lint) stay in their own files: they run on other triggers and schedules.
on:
  push:
    branches: [beta, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psg-release-${{ github.ref }}
  # A newer push to a pull request replaces its older run; runs on beta and main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The last combined-installer release, installed by the migration tests.
  LEGACY_SUITE_TAG: v0.18.1-beta.7

jobs:
  release-tag:
    name: Release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Releases publish only from pushes to the suite's own repository, never from a fork or a
      # pull request. Without a tag the installers carry the Cargo.toml version.
      - name: Release tag
        id: tag
        env:
          PUBLISHES: ${{ github.repository == 'WENSHAO521/psg-pdf' && github.event_name == 'push' }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "$PUBLISHES" == "true" ]]; then tag="$(packaging/release-tag.sh)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none (builds and checks only, nothing is published)}" >> "$GITHUB_STEP_SUMMARY"

  products:
    name: Product identities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: products
      # Upgrade codes, package names, app ids, update stems and file associations agree with
      # packaging/products.toml, and no two products share one.
      - name: Check the product identities
        run: cargo xtask products check
      - name: Product x platform matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(cargo xtask products matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[] | "- \(.name) on \(.platform)"' >> "$GITHUB_STEP_SUMMARY"

  changelog:
    name: Changelog and commit subjects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: CHANGELOG.md is well formed
        run: cargo xtask changelog verify
      # Warnings only: a subject that is not a Conventional Commit is left out of the changelog.
      - name: Commit subjects since the last release
        run: cargo xtask changelog lint

  academic-tests:
    name: Academic tests with TeX Live (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build dependencies, TeX Live, latexmk, Biber and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern \
            texlive-bibtex-extra latexmk biber pandoc
      - name: craft-i18n catalogs
        run: |
          packaging/fetch-craft-i18n.sh "$RUNNER_TEMP/craft-i18n"
          echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n" >> "$GITHUB_ENV"
      - name: Tests of the academic crates and both apps
        run: cargo test --locked -p psg-academic -p psg-academic-pdf -p psg-pdf
      - name: Compile the built-in template from the command line
        run: |
          set -euo pipefail
          cargo run --locked -q -p psg-academic-pdf -- check-tex
          cargo run --locked -q -p psg-academic-pdf -- new "$RUNNER_TEMP/article"
          cargo run --locked -q -p psg-academic-pdf -- compile "$RUNNER_TEMP/article" --out "$RUNNER_TEMP/article.pdf"
          test -s "$RUNNER_TEMP/article.pdf"

  build:
    name: ${{ matrix.name }} (${{ matrix.platform }})
    needs: [release-tag, products]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.products.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.release-tag.outputs.version }}
      CRAFT_I18N_REQUIRED: '1'
      CRAFT_FONTS_REQUIRED: '1'
      DIST: ${{ github.workspace }}/dist/release
      # Sign only what may be published: pull requests build unsigned installers.
      SIGN: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.product }}-${{ matrix.platform }}
      - name: Linux build dependencies and nfpm
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev \
            desktop-file-utils zsync
          # nfpm 2.43.0, checked against the release's checksums.txt.
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_amd64.deb
          echo "4a4402f8f9ea87c669d6a62b333f8e268439974754dd886a01731ecaf9fa6d66  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - name: WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      # Release builds embed the translations and the craft-fonts faces (AGENTS.md §1.4); the
      # *_REQUIRED variables above make a missing one a build error.
      - name: craft-i18n and craft-fonts
        shell: bash
        run: |
          set -euo pipefail
          packaging/fetch-craft-i18n.sh "$RUNNER_TEMP/craft-i18n"
          packaging/fetch-craft-fonts.sh "$RUNNER_TEMP/craft-fonts"
          echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_DIR=$RUNNER_TEMP/craft-fonts" >> "$GITHUB_ENV"
      # A beta's binaries report the beta version; the change stays on the runner. Without a tag
      # (pull requests, manual runs) the Cargo.toml version is kept.
      - name: Set the version
        if: env.VERSION != ''
        shell: bash
        run: |
          set -euo pipefail
          current="$(cargo xtask version)"
          if [[ "$current" != "$VERSION" ]]; then cargo xtask version set "$VERSION"; fi
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: packaging/linux/package.sh --product "${{ matrix.product }}" --formats "appimage deb rpm tar cli"
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ env.SIGN == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.SIGN == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          KEYCHAIN_PASSWORD: ${{ env.SIGN == 'true' && secrets.KEYCHAIN_PASSWORD || '' }}
        run: packaging/macos/import-cert.sh
      - name: Package for macOS
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ env.SIGN == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.SIGN == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.SIGN == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: packaging/macos/package.sh --product "${{ matrix.product }}" --arch universal
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ env.SIGN == 'true' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ env.SIGN == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: packaging/windows/package.ps1 -Product "${{ matrix.product }}" -Arch x64
      # The product's own programs start and answer, and every file is named after the product
      # (its update channel): nothing of the other product is in its artifact.
      - name: Smoke test and file names
        shell: bash
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          set -euo pipefail
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          find_bin() { compgen -G "target/release/$1$ext" || compgen -G "target/*/release/$1$ext" | head -n1; }
          for bin in $(cargo xtask products get "$PRODUCT" binaries); do
            path="$(find_bin "$bin")" || { echo "::error::$bin was not built"; exit 1; }
            "$path" --version
          done
          if [[ "$PRODUCT" == psg-academic-pdf ]]; then "$(find_bin psg-academic-pdf)" templates; fi
          stem="$(cargo xtask products get "$PRODUCT" asset_stem)"
          for f in "$DIST"/*; do
            name="$(basename "$f")"
            case "$name" in
              "$stem"-[0-9]*) ;;
              pdfcraft-cli-[0-9]*) [[ "$PRODUCT" == psg-pdf ]] || { echo "::error::$name does not belong to $PRODUCT"; exit 1; } ;;
              *) echo "::error::$name is not named after $PRODUCT ($stem-<version>-…)"; exit 1 ;;
            esac
          done
      # Signatures: Authenticode on Windows, codesign (and Gatekeeper with a Developer ID) on
      # macOS. Without signing secrets the files are unsigned or ad-hoc signed, and the summary
      # says so; with them, a bad signature fails the build.
      - name: Verify signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HAS_CERT: ${{ env.SIGN == 'true' && secrets.WINDOWS_CERTIFICATE != '' }}
          PRODUCT: ${{ matrix.product }}
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:DIST -Filter '*.msi') + @(Get-ChildItem -Recurse -LiteralPath "target/windows-package/$env:PRODUCT" -Filter '*.exe' -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Host "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($env:HAS_CERT -eq 'true' -and $sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed ($($sig.Status))" }
          }
          if ($env:HAS_CERT -ne 'true') { "Windows: $env:PRODUCT is not Authenticode-signed (no signing certificate)." >> $env:GITHUB_STEP_SUMMARY }
      - name: Verify signatures (macOS)
        if: runner.os == 'macOS'
        env:
          SIGNED: ${{ env.SIGN == 'true' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && '1' || '0' }}
          PRODUCT: ${{ matrix.product }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          app="${CARGO_TARGET_DIR:-target}/macos-package/$PRODUCT/$NAME.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for dmg in "$DIST"/*.dmg; do codesign --verify --verbose=2 "$dmg" || [[ "$SIGNED" == 0 ]]; done
          if [[ "$SIGNED" == 1 ]]; then
            spctl --assess --type execute --verbose=2 "$app"
            for dmg in "$DIST"/*.dmg; do spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"; done
          else
            echo "macOS: $NAME is ad-hoc signed and not notarized (no Developer ID)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Each artifact carries its files' SHA-256, written where they were built; every later job
      # checks the files against it before using them.
      - name: Checksums
        shell: bash
        env:
          LIST: SHA256SUMS-${{ matrix.product }}-${{ matrix.platform }}.txt
        run: |
          set -euo pipefail
          cd "$DIST"
          sha256sum -- * | tee "$RUNNER_TEMP/$LIST"
          mv "$RUNNER_TEMP/$LIST" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.product }}-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  install-linux:
    name: Install, coexist, remove, migrate (${{ matrix.format }})
    needs: build
    # Also after another platform's build failed: these packages may still be complete.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            container: ''
          - format: rpm
            container: fedora:41
    runs-on: ubuntu-22.04
    container: ${{ matrix.container || null }}
    timeout-minutes: 45
    steps:
      - name: Tools (Fedora)
        if: matrix.format == 'rpm'
        run: dnf install -y --setopt=install_weak_deps=False findutils gh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-linux-x86_64'
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: for list in SHA256SUMS-*.txt; do sha256sum -c "$list"; done
      # The last suite package, for the migration test. Skipped (with a warning) if that release
      # is gone.
      - name: The 0.18.x PSG PDF Suite package
        id: suite
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          mkdir -p suite
          if gh release download "$LEGACY_SUITE_TAG" --repo "$GITHUB_REPOSITORY" --dir suite --pattern "psg-pdf-*-linux-x86_64.$FORMAT"; then
            package=(suite/*."$FORMAT")
            echo "package=${package[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$LEGACY_SUITE_TAG has no suite .$FORMAT; the migration test is skipped"
          fi
      - name: apt index
        if: matrix.format == 'deb'
        run: sudo apt-get update
      - name: Install tests
        run: packaging/linux/test-install.sh "${{ matrix.format }}" packages ${{ steps.suite.outputs.package }}

  install-windows:
    name: Install, coexist, uninstall, migrate (Windows)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-windows-x64'
          path: packages
          merge-multiple: true
      - name: Checksums
        shell: bash
        working-directory: packages
        run: for list in SHA256SUMS-*.txt; do sha256sum -c "$list"; done
      - name: The 0.18.x PSG PDF Suite MSI
        id: suite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p suite
          if gh release download "$LEGACY_SUITE_TAG" --repo "$GITHUB_REPOSITORY" --dir suite --pattern 'psg-pdf-*-windows-x64.msi'; then
            msi=(suite/*.msi)
            echo "msi=${msi[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$LEGACY_SUITE_TAG has no suite MSI; the migration test is skipped"
          fi
      - name: Install tests
        shell: pwsh
        run: packaging/windows/test-install.ps1 -Dir packages -SuiteMsi '${{ steps.suite.outputs.msi }}'

  install-macos:
    name: Install, coexist, remove (macOS)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-macos-universal'
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: for list in SHA256SUMS-*.txt; do shasum -a 256 -c "$list"; done
      - name: Install tests
        env:
          SIGNED: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && '1' || '0' }}
        run: packaging/macos/test-install.sh packages

  publish:
    name: Publish ${{ needs.release-tag.outputs.tag }}
    needs: [release-tag, changelog, academic-tests, build, install-linux, install-windows, install-macos]
    # Only with a tag, and only when the changelog and academic checks and the Linux and Windows
    # install tests passed (so both products are there for both). A stable release needs every
    # platform built and installed. A beta publishes what built: on this repository the macOS
    # runners have often never started (the job is cancelled while still queued), and a missing
    # platform shouldn't hold back the Linux and Windows test builds. The notes say what is missing.
    if: >-
      always() && needs.release-tag.outputs.tag != '' &&
      needs.changelog.result == 'success' && needs.academic-tests.result == 'success' &&
      needs.install-linux.result == 'success' && needs.install-windows.result == 'success' &&
      ((needs.build.result == 'success' && needs.install-macos.result == 'success') || contains(needs.release-tag.outputs.tag, '-beta.'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-notes
      # Not `assets`: the checkout already has an assets/ folder (icons, fonts), and its
      # subfolders would end up among the release files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-files
          merge-multiple: true
      # Every file against the checksum written where it was built, then one list per product
      # and SHA256SUMS.txt over everything (the in-app updaters read that one).
      - name: Checksums
        working-directory: release-files
        run: |
          set -euo pipefail
          compgen -G 'SHA256SUMS-*.txt' >/dev/null || { echo '::error::no platform built anything to publish'; exit 1; }
          for list in SHA256SUMS-*.txt; do sha256sum -c "$list"; done
          rm SHA256SUMS-*.txt
          for product in $(cargo xtask products get psg-pdf asset_stem) $(cargo xtask products get psg-academic-pdf asset_stem); do
            files=$(compgen -G "$product-[0-9]*" || true)
            [[ "$product" == psg-pdf ]] && files="$files $(compgen -G 'pdfcraft-cli-[0-9]*' || true)"
            # shellcheck disable=SC2086
            [[ -n "${files// /}" ]] && sha256sum -- $files > "SHA256SUMS-$product.txt"
          done
          shopt -s extglob
          sha256sum -- !(SHA256SUMS*) | tee SHA256SUMS.txt
      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "PSG ${TAG}: PSG PDF and PSG Academic PDF, two independent products. Install either"
            echo "or both; each has its own installers, updates and uninstaller."
            echo
            if [[ "$TAG" == *-beta.* ]]; then
              echo "This is a beta: a test build of the \`beta\` branch, not a stable release."
              echo
              echo "## Changes since the last release"
              echo
              cargo xtask changelog notes --unreleased
            else
              echo "## Changes"
              echo
              cargo xtask changelog notes --version "${TAG#v}"
            fi
            echo
            echo "## Downloads"
            echo
            platform() { # <glob> <line>: the line when a file matches, else a note that it is missing
              if compgen -G "release-files/$1" >/dev/null; then echo "- $2"; else echo "- ${2%%:*}: not in this build"; fi
            }
            for stem in psg-pdf psg-academic-pdf; do
              case "$stem" in
                psg-pdf) echo "### PSG PDF: reading, organizing and protecting PDFs" ;;
                psg-academic-pdf) echo "### PSG Academic PDF: typesetting accepted articles with pdfLaTeX" ;;
              esac
              echo
              platform "$stem-[0-9]*-macos-universal.dmg" "macOS 11+ (Apple silicon and Intel): \`$stem-*-macos-universal.dmg\`"
              platform "$stem-[0-9]*-windows-x64.msi" "Windows 10+ x64: \`$stem-*-windows-x64.msi\` (installer) or \`$stem-*-windows-x64-portable.zip\`"
              platform "$stem-[0-9]*-linux-x86_64.deb" "Linux x86_64: \`$stem-*.deb\`, \`.rpm\`, \`.AppImage\` or \`.tar.gz\`"
              echo "- Checksums: \`SHA256SUMS-$stem.txt\`"
              echo
            done
            echo "PSG Academic PDF needs a TeX installation (pdflatex, latexmk, biber); see the README."
            echo "\`SHA256SUMS.txt\` lists every file's SHA-256."
            echo
            echo "### Coming from the PSG PDF Suite (0.18)"
            echo
            echo "The new PSG PDF replaces the suite and keeps your settings. If you used PSG Academic PDF,"
            echo "install it as well: your projects stay where they were. On Windows, install PSG PDF first;"
            echo "PSG Academic PDF's installer asks for that while the suite is still installed."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        run: |
          set -euo pipefail
          flags=(--latest)
          if [[ "$TAG" == *-beta.* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PSG PDF and PSG Academic PDF $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"
