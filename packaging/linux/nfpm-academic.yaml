# PSG Academic PDF's .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by
# `package.sh --product psg-academic-pdf`, which stages the file tree, substitutes its path for
# ${STAGE} (nfpm doesn't expand env vars in `src`) and exports VERSION, RELEASE and NFPM_ARCH.
name: psg-academic-pdf
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
# 1 for releases; 1.<label> for a labelled local build (PDFCRAFT_BUILD_LABEL), which sorts after
# the release of the same version and before the next one.
release: ${RELEASE}
section: tex
priority: optional
maintainer: ${PDFCRAFT_MAINTAINER}
vendor: Panorama Scholarly Group
homepage: https://github.com/WENSHAO521/psg-pdf
license: MIT OR Apache-2.0
description: |-
  PSG Academic PDF: final-publication typesetting of accepted journal articles
  with journal templates and the local TeX installation (pdfLaTeX, latexmk,
  Biber), with typesetting diagnostics and DOCX import through Pandoc.
  PSG PDF is a separate package (psg-pdf).

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
#
# Migrating from the suite: the 0.18.x "PSG PDF Suite" package was named psg-pdf and installed
# /usr/bin/psg-academic-pdf too. The deb `replaces` it, so dpkg hands those files to this package
# without removing PSG PDF; the rpm can't take files over, so it conflicts with the suite until
# psg-pdf is upgraded to 0.19 or later (both in one transaction works:
# `dnf install ./psg-pdf-*.rpm ./psg-academic-pdf-*.rpm`).
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    replaces:
      - psg-pdf (<< 0.19.0~)
    # TeX is never bundled: the app uses the TeX installation on the PATH.
    recommends:
      - texlive-latex-recommended
      - texlive-latex-extra
      - texlive-bibtex-extra
      - lmodern
      - latexmk
      - biber
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
    suggests:
      - pandoc
      - psg-pdf
  rpm:
    # Library sonames rather than package names, so the same requirements resolve on Fedora/RHEL
    # and openSUSE (which has no libxkbcommon, vulkan-loader or libglvnd-egl package). The glibc
    # floor names libm because the binaries' GLIBC_2.35 symbols (hypot, hypotf) are libm's: RHEL 9's
    # glibc 2.34 provides libc.so.6(GLIBC_2.35) through backports, but not this, so it refuses.
    depends:
      - libc.so.6()(64bit)
      - libm.so.6(GLIBC_2.35)(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    conflicts:
      - psg-pdf < 0.19.0~
    recommends:
      - texlive-scheme-medium
      - latexmk
      - biber
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal
    suggests:
      - pandoc
      - psg-pdf

contents:
  - src: ${STAGE}/usr/bin/psg-academic-pdf
    dst: /usr/bin/psg-academic-pdf
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
