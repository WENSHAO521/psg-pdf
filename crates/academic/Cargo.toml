[package]
name = "psg-academic"
description = "PSG Academic PDF core: local TeX detection, sandboxed latexmk/pdfLaTeX compilation, journal templates and publication metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Publication dates are validated as calendar dates through Jiff (no hand-rolled calendar code).
jiff = { workspace = true }
# Template manifests and saved projects are TOML; the same major version xtask and ui-egui use.
toml = "1"
# Word import restructures Pandoc's JSON document tree (figures, tables, front matter).
serde_json = { workspace = true }
# Templates people add arrive as .zip files (MIT; the version and features craft-update uses).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# SciFlow template configurations are YAML (configuration.sfo.yml); pure Rust, MIT OR Apache-2.0.
yaml-rust2 = { version = "0.13", default-features = false }
# Chooses the zlib backend for zip's deflate, as the workspace does.
flate2 = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
